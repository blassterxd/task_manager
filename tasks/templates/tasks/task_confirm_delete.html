{% extends "tasks/base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h2 class="mb-3">Удалить задачу?</h2>
      <p>Вы действительно хотите удалить задачу «{{ task.title }}»? Это действие нельзя отменить.</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a class="btn btn-outline-secondary" href="{% url 'tasks:list' %}">Отмена</a>
      </form>
    </div>
  </div>
{% endblock content %}
